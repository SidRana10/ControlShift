[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "controlshift"
version = "0.1.0"
description = "Version-aware enterprise RAG comparing NIST CSF 1.1 and 2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "rank-bm25>=0.2.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
controlshift-ingest = "controlshift.ingest.cli:main"
controlshift-db = "controlshift.store.cli:main"
controlshift-retrieve = "controlshift.retrieval.cli:main"
controlshift-evidence = "controlshift.evidence.cli:main"
controlshift-serve = "controlshift.api.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: uses the real downloaded models (skipped if not cached)",
    "live: calls the real LLM provider (needs RUN_LIVE_LLM_TESTS=1 plus credentials)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# long prose lists in the generated report are written as adjacent string literals on purpose
"src/controlshift/evaluation/report.py" = ["ISC004"]
"eval/*.py" = ["ISC004"]
